name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Binary for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: shellsage-linux-amd64
          - goos: linux
            goarch: arm64
            output: shellsage-linux-arm64
          - goos: darwin
            goarch: amd64
            output: shellsage-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: shellsage-darwin-arm64
          - goos: windows
            goarch: amd64
            output: shellsage-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="v3.0.0"
          fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o dist/${{ matrix.output }} .

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ShellSage ${{ github.ref_name }} - Autonomous AI Developer & Security CLI"
          files: |
            dist/*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            # 🚀 ShellSage v3.0.0 - Official Release

            Welcome to the next generation of **ShellSage** — The Autonomous AI Terminal Assistant & Developer Platform.

            ---

            ### 📦 Included Cross-Platform Binaries
            - **Linux (x86_64 / amd64)**: `shellsage-linux-amd64`
            - **Linux (ARM64)**: `shellsage-linux-arm64`
            - **macOS (Apple Silicon M1/M2/M3/M4 / arm64)**: `shellsage-darwin-arm64`
            - **macOS (Intel / amd64)**: `shellsage-darwin-amd64`
            - **Windows (x86_64 / amd64)**: `shellsage-windows-amd64.exe`
            - **Checksums**: `SHA256SUMS.txt`

            ---

            ### 🌟 Key Highlights & Capabilities
            1. **Universal Multi-Provider Engine**: Direct streaming support for OpenRouter, OpenAI, Anthropic Claude, Google Gemini, Groq Cloud, DeepSeek, Ollama (Local LLMs), and Custom endpoints.
            2. **Interactive TUI & Setup Wizard**: `/config` and `--config` interactive terminal menus.
            3. **Ethical Defensive Security & Vulnerability Audit Suite**:
               - `/sec headers <url>`: HTTP Security Headers & Cookie Auditor (HSTS, CSP, X-Frame-Options, etc.).
               - `/sec ssl <domain>`: Live SSL/TLS Certificate Validator & Expiry Checker.
               - `/sec sast [path]`: Static Application Security Testing (SAST) for leaked keys, tokens, and SQL injections.
               - `/sec ports <host>`: Safe service port availability scanner.
               - `/sec audit <target>` / `/audit`: Complete unified security assessment.
            4. **Autonomous ReAct Agent & Tools**: Autonomous goal execution with local filesystem operations, shell execution, live web search, and web scraping.
            5. **Developer Modes**: Architectural Planning (`/plan`), Root-Cause Diagnostics (`/debug`), and Documentation Generator (`/doc`).
            6. **Conversation Tree & Branching**: Fork chats and explore alternative AI completions (`/retry`, `/alt`, `/branch`, `/tree`).
            7. **Task Queue & Local Time-Based Scheduler**: Background task queue (`/queue`) and local machine clock scheduler (`/schedule at <HH:MM>`).
            8. **Native Clipboard & Exporters**: `/copy` (last response / code-only / all) and multi-format exporters (Markdown, printable PDF, dark-themed HTML, JSON).
            9. **Docker & CI/CD**: Ready-to-use `Dockerfile` and `docker-compose.yml`.
