name: CI Test Suite

on:
  push:
    branches: [ main, master, 'feat/**', 'fix/**', 'arena/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      go_version:
        description: 'Go version override'
        required: false
        default: '1.24'
      race:
        description: 'Run with -race'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  test:
    name: Test on ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ github.event.inputs.go_version || matrix.go }}
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run GoFmt check
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: Run Unit Tests
        run: |
          set -o pipefail
          go test -v $([ "${{ github.event.inputs.race || 'true' }}" = "true" ] && echo "-race") ./... 2>&1 | tee test-out.txt || true
          set +o pipefail
          if grep -q "^--- FAIL" test-out.txt || grep -q "FAIL\s" test-out.txt; then
            grep "^--- FAIL" test-out.txt | sed 's/^/::error title=Test failed::/' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            grep -B1 -A15 "^--- FAIL" test-out.txt | head -120 | sed 's/^/%0A/; s/^::error:://' > /tmp/x 2>/dev/null || true
            # surface the interesting slice as an annotation body via workflow command
            {
              echo "::error title=Windows test failure details::"
              awk '/^--- FAIL/{flag=1} flag{print} /FAIL[[:space:]]+shellsage/{if(flag){exit}}' test-out.txt | head -60 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'
            } > /dev/null
            # real annotation:
            DETAILS=$(awk '/^--- FAIL/{flag=1} flag{print}' test-out.txt | head -40 | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error file=.github/workflows/ci.yml,line=1,title=failing tests (pipe-delimited)::${DETAILS}"
            exit 1
          fi
          grep -q "^ok" test-out.txt || { echo "no tests ran?"; exit 1; }

      - name: Build Binary
        run: go build -v -o shellsage .
